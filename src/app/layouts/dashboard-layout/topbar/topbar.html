<header
  class="sticky top-0 z-30 flex h-16 items-center justify-between gap-4 border-b border-(--border) bg-(--bg-secondary)/95 px-4 backdrop-blur-md sm:px-6 lg:px-8"
>
  <!-- left: mobile menu + current page -->
  <div class="flex min-w-0 items-center gap-3">
    <button
      type="button"
      class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-(--text-secondary) transition-colors hover:bg-(--border) hover:text-(--text-primary) md:hidden"
      aria-label="Open navigation menu"
      [attr.aria-expanded]="mobileMenuOpen"
      (click)="menuToggle.emit()"
    >
      <svg lucideMenu [size]="21"></svg>
    </button>

    <div class="min-w-0">
      <h1 class="truncate text-base font-semibold tracking-tight text-(--text-primary) sm:text-lg">
        {{ pageTitle() }}
      </h1>

      <p class="hidden text-xs text-(--text-secondary) sm:block">WalletWatch Dashboard</p>
    </div>
  </div>

  <!-- right: actions and profile -->
  <div class="flex shrink-0 items-center gap-2 sm:gap-4">
    <!-- theme toggle -->
    <button
      type="button"
      (click)="themeService.toggleTheme()"
      [attr.aria-label]="
        themeService.theme() === 'light' ? 'Switch to dark mode' : 'Switch to light mode'
      "
      class="flex h-9 w-9 items-center justify-center rounded-lg border border-(--border) bg-(--bg-primary) text-(--text-secondary) transition-all duration-200 hover:border-(--accent) hover:text-(--accent)"
    >
      @if (themeService.theme() === 'light') {
        <svg lucideMoon [size]="18"></svg>
      } @else {
        <svg lucideSun [size]="18"></svg>
      }
    </button>

    <div class="h-8 w-px bg-(--border)"></div>

    <!-- profile dropdown -->
    <app-profile-menu (logoutRequested)="onLogout()" />
  </div>
</header>
