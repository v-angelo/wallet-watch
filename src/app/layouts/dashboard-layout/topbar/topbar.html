<header
  class="sticky top-0 z-30 flex h-16 items-center justify-between gap-4 border-b border-(--border) bg-(--bg-secondary)/95 px-4 backdrop-blur-md sm:px-6 lg:px-8"
>
  <!-- left: menu and search -->
  <div class="flex min-w-0 flex-1 items-center gap-3 sm:gap-5">
    <button
      type="button"
      aria-label="Open navigation menu"
      class="shrink-0 rounded-xl p-2 text-(--text-secondary) transition-colors hover:bg-(--border) hover:text-(--text-primary) lg:hidden"
      (click)="menuToggle.emit()"
    >
      <svg lucideMenu [size]="22"></svg>
    </button>

    <div class="relative hidden w-full max-w-md sm:block">
      <svg
        lucideSearch
        [size]="18"
        class="pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-(--text-secondary)"
      ></svg>

      <input
        type="search"
        placeholder="Search transactions..."
        aria-label="Search transactions"
        class="w-full rounded-xl border border-(--border) bg-(--bg-primary) py-2.5 pr-4 pl-10 text-sm text-(--text-primary) transition outline-none placeholder:text-(--text-secondary) focus:border-(--accent) focus:ring-2 focus:ring-(--accent)/20"
      />
    </div>
  </div>

  <!-- right: actions and profile -->
  <div class="flex shrink-0 items-center gap-2 sm:gap-4">
    <!-- mobile search -->
    <button
      type="button"
      aria-label="Search"
      class="rounded-xl p-2 text-(--text-secondary) transition-colors hover:bg-(--border) hover:text-(--text-primary) sm:hidden"
    >
      <svg lucideSearch [size]="20"></svg>
    </button>

    <!-- notifications -->
    <button
      type="button"
      aria-label="Notifications"
      class="relative rounded-xl p-2 text-(--text-secondary) transition-colors hover:bg-(--border) hover:text-(--text-primary)"
    >
      <svg lucideBell [size]="21"></svg>

      <span
        class="absolute top-2 right-2 h-2 w-2 rounded-full bg-(--accent) ring-2 ring-(--bg-secondary)"
      ></span>
    </button>

    <div class="h-8 w-px bg-(--border)"></div>

    <!-- profile dropdown -->
    <div class="relative">
      <button
        type="button"
        aria-label="Open profile menu"
        [attr.aria-expanded]="profileMenuOpen"
        class="flex items-center gap-2 rounded-xl p-1.5 transition-colors hover:bg-(--border) sm:px-2"
        (click)="toggleProfileMenu()"
      >
        <span
          class="flex h-9 w-9 items-center justify-center rounded-full bg-(--accent)/15 text-sm font-semibold text-(--accent)"
        >
          WW
        </span>

        <span class="hidden text-left sm:block">
          <span class="block text-sm font-semibold text-(--text-primary)"> My Account </span>
          <span class="block text-xs text-(--text-secondary)"> Personal </span>
        </span>

        <svg
          lucideChevronDown
          [size]="16"
          class="hidden text-(--text-secondary) transition-transform sm:block"
          [class.rotate-180]="profileMenuOpen"
        ></svg>
      </button>

      @if (profileMenuOpen) {
        <div
          class="absolute top-full right-0 mt-3 w-52 animate-fade-left rounded-xl border border-(--border) bg-(--bg-secondary) p-2 shadow-xl"
        >
          <a
            routerLink="/app/dashboard/settings"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-(--text-secondary) transition-colors hover:bg-(--border) hover:text-(--text-primary)"
            (click)="closeProfileMenu()"
          >
            <svg lucideUserRound [size]="18"></svg>
            My Profile
          </a>

          <a
            routerLink="/app/dashboard/settings"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-(--text-secondary) transition-colors hover:bg-(--border) hover:text-(--text-primary)"
            (click)="closeProfileMenu()"
          >
            <svg lucideSettings [size]="18"></svg>
            Settings
          </a>

          <div class="my-1 border-t border-(--border)"></div>

          <button
            type="button"
            class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-(--danger) transition-colors hover:bg-(--danger)/10"
            (click)="onLogout()"
          >
            <svg lucideLogOut [size]="18"></svg>
            Log out
          </button>
        </div>
      }
    </div>
  </div>
</header>
