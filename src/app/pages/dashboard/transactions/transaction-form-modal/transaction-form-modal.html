<div
  class="fixed inset-0 z-50 flex items-end justify-center bg-black/60 p-0 backdrop-blur-sm sm:items-center sm:p-4"
>
  <section
    role="dialog"
    aria-modal="true"
    aria-labelledby="transaction-modal-title"
    class="flex max-h-[92dvh] w-full max-w-3xl animate-fade-up flex-col overflow-hidden rounded-t-2xl border border-(--border) bg-(--bg-secondary) shadow-2xl sm:max-h-[85dvh] sm:rounded-2xl"
  >
    <!-- modal header -->
    <header
      class="flex shrink-0 items-start justify-between gap-4 border-b border-(--border) px-5 py-4 sm:px-6"
    >
      <div class="min-w-0">
        <h2 id="transaction-modal-title" class="text-lg font-semibold text-(--text-primary)">
          {{ editingTransactionId ? 'Edit Transaction' : 'Add Transaction' }}
        </h2>

        <p class="mt-1 text-sm text-(--text-secondary)">Record your income or expenses.</p>
      </div>

      <button
        type="button"
        aria-label="Close transaction form"
        [disabled]="isSaving"
        (click)="cancel.emit()"
        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-(--text-secondary) transition hover:bg-(--bg-primary) hover:text-(--text-primary) disabled:opacity-50"
      >
        <svg lucideX [size]="19"></svg>
      </button>
    </header>

    <!-- scrollable form -->
    <div class="min-h-0 flex-1 overflow-y-auto p-5 sm:p-6">
      <form
        id="transaction-form"
        class="grid grid-cols-1 gap-4 sm:grid-cols-2"
        (submit)="submitForm($event)"
      >
        <div class="space-y-2 sm:col-span-2">
          <label for="transaction-title" class="text-sm font-medium text-(--text-primary)">
            Description
          </label>

          <input
            id="transaction-title"
            name="title"
            required
            maxlength="100"
            [value]="newTransaction.title"
            (input)="updateField('title', $any($event.target).value)"
            placeholder="e.g. Grocery shopping"
            class="w-full rounded-xl border border-(--border) bg-(--bg-primary) px-3.5 py-3 text-sm text-(--text-primary) transition outline-none focus:border-(--accent) focus:ring-2 focus:ring-(--accent)/15"
          />
        </div>

        <div class="space-y-2">
          <label for="transaction-type" class="text-sm font-medium text-(--text-primary)">
            Type
          </label>

          <select
            id="transaction-type"
            name="type"
            [value]="newTransaction.type"
            (change)="updateField('type', $any($event.target).value)"
            class="w-full rounded-xl border border-(--border) bg-(--bg-primary) px-3.5 py-3 text-sm text-(--text-primary) outline-none focus:border-(--accent)"
          >
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </div>

        <div class="space-y-2">
          <label for="transaction-category" class="text-sm font-medium text-(--text-primary)">
            Category
          </label>

          <select
            id="transaction-category"
            name="category"
            [value]="newTransaction.category"
            (change)="updateField('category', $any($event.target).value)"
            [disabled]="newTransaction.type === 'income'"
            class="w-full rounded-xl border border-(--border) bg-(--bg-primary) px-3.5 py-3 text-sm text-(--text-primary) outline-none focus:border-(--accent) disabled:opacity-50"
          >
            @for (category of categories; track category) {
              @if (category !== 'Income') {
                <option [value]="category">{{ category }}</option>
              }
            }
          </select>
        </div>

        <div class="space-y-2">
          <label for="transaction-amount" class="text-sm font-medium text-(--text-primary)">
            Amount ({{ currencySymbol }})
          </label>

          <input
            id="transaction-amount"
            name="amount"
            type="number"
            min="0.01"
            step="0.01"
            required
            [value]="newTransaction.amount"
            (input)="updateField('amount', $any($event.target).value)"
            placeholder="0.00"
            class="w-full rounded-xl border border-(--border) bg-(--bg-primary) px-3.5 py-3 text-sm text-(--text-primary) outline-none focus:border-(--accent)"
          />
        </div>

        <div class="space-y-2">
          <label for="transaction-date" class="text-sm font-medium text-(--text-primary)">
            Date
          </label>

          <input
            id="transaction-date"
            name="date"
            type="date"
            required
            [value]="newTransaction.date"
            (input)="updateField('date', $any($event.target).value)"
            class="w-full rounded-xl border border-(--border) bg-(--bg-primary) px-3.5 py-3 text-sm text-(--text-primary) outline-none focus:border-(--accent)"
          />
        </div>
      </form>
    </div>

    <!-- modal footer -->
    <footer
      class="flex shrink-0 flex-col-reverse gap-3 border-t border-(--border) bg-(--bg-secondary) px-5 py-4 sm:flex-row sm:justify-end sm:px-6"
    >
      <button
        type="button"
        [disabled]="isSaving"
        (click)="cancel.emit()"
        class="inline-flex w-full items-center justify-center gap-2 rounded-xl border border-(--border) bg-(--bg-primary) px-5 py-3 text-sm font-semibold text-(--text-primary) transition hover:border-(--accent) disabled:cursor-not-allowed disabled:opacity-60 sm:w-auto"
      >
        Cancel
      </button>

      <button
        type="submit"
        form="transaction-form"
        [disabled]="isSaving"
        class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-(--accent) px-5 py-3 text-sm font-semibold text-(--bg-primary) transition hover:bg-(--accent-hover) disabled:cursor-not-allowed disabled:opacity-60 sm:w-auto"
      >
        <svg lucidePlus [size]="17"></svg>

        {{
          isSaving
            ? editingTransactionId
              ? 'Saving Changes...'
              : 'Saving...'
            : editingTransactionId
              ? 'Update Transaction'
              : 'Add Transaction'
        }}
      </button>
    </footer>
  </section>
</div>
