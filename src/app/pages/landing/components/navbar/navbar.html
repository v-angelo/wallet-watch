<nav
  class="sticky top-0 z-50 border-b border-(--border) bg-(--bg-secondary)/95 text-(--text-primary) backdrop-blur-md transition-colors duration-200"
>
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-5 sm:px-6 lg:px-8">
    <!-- logo -->
    <a
      href="#"
      class="flex items-center gap-2 text-xl font-bold tracking-tight"
      (click)="closeMobileMenu()"
    >
      <div
        class="flex h-9 w-9 items-center justify-center rounded-xl bg-(--accent) text-white shadow-sm"
      >
        <span class="text-lg">W</span>
      </div>

      <span> Wallet<span class="text-(--accent)">Watch</span> </span>
    </a>

    <!-- desktop navigation -->
    <div class="hidden items-center gap-8 md:flex">
      <a
        href="#features"
        class="text-sm font-medium text-(--text-secondary) transition-colors hover:text-(--text-primary)"
      >
        Features
      </a>

      <a
        href="#about"
        class="text-sm font-medium text-(--text-secondary) transition-colors hover:text-(--text-primary)"
      >
        About
      </a>

      <!-- theme toggle -->
      <button
        type="button"
        (click)="themeService.toggleTheme()"
        [attr.aria-label]="
          themeService.theme() === 'light' ? 'Switch to dark mode' : 'Switch to light mode'
        "
        class="flex h-9 w-9 items-center justify-center rounded-lg border border-(--border) bg-(--bg-primary) text-(--text-secondary) transition-all duration-200 hover:border-(--accent) hover:text-(--accent)"
      >
        @if (themeService.theme() === 'light') {
          <svg lucideMoon [size]="18"></svg>
        } @else {
          <svg lucideSun [size]="18"></svg>
        }
      </button>

      <a
        href="/login"
        class="text-sm font-semibold text-(--text-secondary) transition-colors hover:text-(--text-primary)"
      >
        Login
      </a>

      <a
        href="/register"
        class="rounded-lg bg-(--accent) px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition-all duration-200 hover:bg-(--accent-hover) hover:shadow-md"
      >
        Get Started
      </a>
    </div>

    <!-- mobile controls -->
    <div class="flex items-center gap-2 md:hidden">
      <!-- theme toggle -->
      <button
        type="button"
        (click)="themeService.toggleTheme()"
        [attr.aria-label]="
          themeService.theme() === 'light' ? 'Switch to dark mode' : 'Switch to light mode'
        "
        class="flex h-9 w-9 items-center justify-center rounded-lg border border-(--border) bg-(--bg-primary) text-(--text-secondary) transition-colors duration-200 hover:border-(--accent) hover:text-(--accent)"
      >
        @if (themeService.theme() === 'light') {
          <svg lucideMoon [size]="18"></svg>
        } @else {
          <svg lucideSun [size]="18"></svg>
        }
      </button>

      <!-- menu button -->
      <button
        type="button"
        (click)="toggleMobileMenu()"
        [attr.aria-label]="mobileMenuOpen() ? 'Close navigation menu' : 'Open navigation menu'"
        class="flex h-9 w-9 items-center justify-center rounded-lg border border-(--border) bg-(--bg-primary) text-(--text-primary)"
      >
        @if (mobileMenuOpen()) {
          <svg lucideX [size]="20"></svg>
        } @else {
          <svg lucideMenu [size]="20"></svg>
        }
      </button>
    </div>
  </div>

  <!-- mobile menu -->
  <div
    class="absolute top-full right-0 left-0 origin-top border-b border-(--border) bg-(--bg-secondary) px-5 py-5 shadow-lg transition-all duration-200 ease-out md:hidden"
    [class.grid-rows-[0fr]]="!mobileMenuOpen()"
    [class.grid-rows-[1fr]]="mobileMenuOpen()"
    [class.opacity-0]="!mobileMenuOpen()"
    [class.opacity-100]="mobileMenuOpen()"
    [class.-translate-y-2]="!mobileMenuOpen()"
    [class.translate-y-0]="mobileMenuOpen()"
  >
    <div class="overflow-hidden">
      <div class="border-t border-(--border) bg-(--bg-secondary) px-5 py-5">
        <div class="mx-auto flex max-w-7xl flex-col gap-1">
          <a
            href="#features"
            (click)="closeMobileMenu()"
            class="rounded-lg px-3 py-3 text-sm font-medium text-(--text-secondary) transition-colors duration-200 hover:bg-(--bg-primary) hover:text-(--text-primary)"
          >
            Features
          </a>

          <a
            href="#about"
            (click)="closeMobileMenu()"
            class="rounded-lg px-3 py-3 text-sm font-medium text-(--text-secondary) transition-colors duration-200 hover:bg-(--bg-primary) hover:text-(--text-primary)"
          >
            About
          </a>

          <div class="my-2 border-t border-(--border)"></div>

          <a
            href="/login"
            (click)="closeMobileMenu()"
            class="rounded-lg px-3 py-3 text-sm font-semibold text-(--text-secondary) transition-colors duration-200 hover:bg-(--bg-primary) hover:text-(--text-primary)"
          >
            Login
          </a>

          <a
            href="/register"
            (click)="closeMobileMenu()"
            class="mt-1 rounded-lg bg-(--accent) px-4 py-3 text-center text-sm font-semibold text-white transition-all duration-200 hover:bg-(--accent-hover)"
          >
            Get Started
          </a>
        </div>
      </div>
    </div>
  </div>
</nav>
