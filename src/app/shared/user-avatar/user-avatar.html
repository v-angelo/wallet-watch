<div
  class="flex shrink-0 items-center justify-center overflow-hidden rounded-full bg-(--accent)/15 font-semibold text-(--accent)"
  [style.width.px]="size"
  [style.height.px]="size"
  [style.font-size.px]="size * 0.38"
>
  @if (profilePic && !imageError()) {
    <img
      [src]="profilePic"
      [alt]="currentUser()?.username || 'User'"
      (error)="onImageError()"
      (load)="onImageLoad()"
      class="h-full w-full rounded-full object-cover"
    />
  } @else {
    <span>
      {{ userInitials }}
    </span>
  }
</div>
